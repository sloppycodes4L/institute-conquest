<style>
:root {
  --bg: #0b0707; --line: #4d2518; --gold: #e6bb5c; --gold-dim: #9c7a36; --ink: #f1e6d6; --ink-dim: #b8a48c; --ink-mute: #7d6b5a;
  --display: 'Cinzel', 'Trajan Pro', serif; --ui: 'Barlow Condensed', 'Segoe UI', sans-serif; --prose: 'Crimson Pro', Georgia, serif;
}
html, body { margin: 0; height: 100%; background: #050302; color: var(--ink); font-family: var(--ui); font-size: 16px; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.over { cursor: pointer; }
#shade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(3,1,0,.72) 100%); }
.panel { position: absolute; background: rgba(12,7,6,.86); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
#top { top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 24px); box-sizing: border-box; }
.seg { display: flex; gap: 2px; background: rgba(0,0,0,.35); border-radius: 7px; padding: 2px; }
button { font: 600 16px var(--ui); letter-spacing: .02em; color: var(--ink-dim); background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
button:hover { color: var(--ink); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
button[aria-pressed="true"] { color: #1a0e08; background: var(--gold); }
#side { left: 12px; bottom: 12px; width: 232px; }
#side p { margin: 2px 4px 6px; }
#side .lead { font: 700 15px var(--display); letter-spacing: .06em; color: var(--gold); }
#side .hint { font: italic 15.5px/1.3 var(--prose); color: var(--ink-dim); margin-top: 8px; }
.house { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 5px 7px; border-color: transparent; }
.house[aria-pressed="true"] { background: rgba(230,187,92,.1); border-color: var(--gold-dim); color: var(--ink); }
.house .sig { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font: 15px serif; color: #fff; text-shadow: 0 1px 2px #000; flex: none; }
.house b { font: 700 15.5px var(--display); color: var(--ink); flex: 1; }
.house span.n { font-size: 14.5px; color: var(--ink-dim); white-space: nowrap; }
#tip { position: absolute; pointer-events: none; background: rgba(12,7,6,.92); border: 1px solid var(--gold-dim); border-radius: 8px; padding: 7px 11px 8px; max-width: 260px; transform: translate(16px, 16px); }
#tip b { display: block; font: 700 16px var(--display); }
#tip span { display: block; font-size: 15px; color: var(--ink-dim); line-height: 1.25; }
#tip i { font-style: normal; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
#boot { position: absolute; inset: 0; display: grid; place-items: center; background: #050302; z-index: 5; text-align: center; font: italic 19px var(--prose); color: var(--ink-dim); }
#boot b { display: block; font: 900 26px var(--display); letter-spacing: .1em; color: var(--gold); margin-bottom: 6px; font-style: normal; }
[hidden] { display: none !important; }
@media (max-width: 640px) { #side { width: auto; right: 12px; } #side .hint { display: none; } }
</style>
</head>

  <p class="lead">Take land as</p>
  <div id="houses"></div>

</div>
<div id="tip" hidden></div>
<div id="boot"><div><b>Skirmish</b><span id="bootmsg">Drawing the map</span></div></div>

{ const c = tableTex.image.getContext('2d'); c.fillStyle = 'rgba(0,0,0,.55)'; for (const y of [0, 340, 690]) c.fillRect(0, y, 1024, 3); tableTex.needsUpdate = true; }
const pieceTex = grain(256, 256, '#ffffff', 220, (v) => `rgba(40,20,5,${.04 + v * .12})`);
const table = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ map: tableTex, roughness: .62 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true;
scene.add(table);

const GEO = {
  cube: new RoundedBoxGeometry(.86, .86, .86, 3, .09),
  bar: new RoundedBoxGeometry(2.05, .8, .8, 3, .09),
  pyr: (() => { const g = new THREE.ConeGeometry(.84, 1.25, 4).toNonIndexed(); g.rotateY(Math.PI / 4); g.computeVertexNormals(); return g; })(),
  coin: new THREE.CylinderGeometry(.98, .98, .26, 36), face: new THREE.CircleGeometry(.98, 36),
};
const HGT = { cube: .86, bar: .8, pyr: 1.25 };
const pieceMat = HOUSES.map((h) => new THREE.MeshStandardMaterial({ color: h.color, map: pieceTex, roughness: .46 }));
const coinMat = new THREE.MeshStandardMaterial({ color: '#c9a56b', map: pieceTex, roughness: .6 });
const faceMats = new Map();
function faceMat(n) {
  let m = faceMats.get(n);
  if (!m) {
    const c = mk(128, 128), x = c.getContext('2d');
    x.fillStyle = '#d6b47a'; x.fillRect(0, 0, 128, 128);
    const r = rng(n * 13 + 1); for (let i = 0; i < 30; i++) { x.strokeStyle = `rgba(90,55,20,${.05 + r() * .1})`; x.lineWidth = 1 + r() * 2; const y = r() * 128; x.beginPath(); x.moveTo(0, y); x.lineTo(128, y + (r() - .5) * 8); x.stroke(); }
    x.strokeStyle = 'rgba(60,34,12,.7)'; x.lineWidth = 4; x.beginPath(); x.arc(64, 64, 55, 0, 6.3); x.stroke();
    x.fillStyle = '#2a160a'; x.font = `900 ${n > 9 ? 62 : 76}px Cinzel`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(n), 64, 69);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    m = new THREE.MeshStandardMaterial({ map: t, roughness: .6 }); faceMats.set(n, m);
  }
  return m;
}

let W = null; // the board on the table: { geo, art, owner, armies, group, tex, piles[], hover }
let view = 'table', picked = 0, flight = null;
const SHEET_Y = .04, PIECE = 1.5;

/** Where each piece of a garrison stands, around its territory's heart. */
function pileSpots(n, r) {
  const P = Math.min(4, Math.floor(n / 10)), rest = n - P * 10, B = Math.floor(rest / 5), C = rest % 5, spots = [];
  const cubes = [[], [[0, 0, 0]], [[-.5, 0, 0], [.5, 0, 0]], [[-.5, 0, 0], [.5, 0, 0], [0, 1, 0]], [[-.5, 0, -.42], [.5, 0, -.42], [-.12, 0, .56], [0, 1, -.42]]][C];
  const cw = C > 1 ? 1.95 : C ? .95 : 0, fw = (B ? B * 2.2 : 0) + (B && C ? .25 : 0) + cw, two = P && (B || C), zf = two ? .8 : 0, zb = two ? -.72 : 0;
  for (let i = 0; i < P; i++) spots.push({ kind: 'pyr', x: (i - (P - 1) / 2) * 1.5, z: zb, lvl: 0 });
  let x = -fw / 2;
  for (let i = 0; i < B; i++) { spots.push({ kind: 'bar', x: x + 1.05, z: zf, lvl: 0 }); x += 2.2; }
  if (B && C) x += .25;
  for (const [dx, lvl, dz] of cubes) spots.push({ kind: 'cube', x: x + cw / 2 + dx * .95, z: zf + dz * .95, lvl });
  for (const s of spots) { s.rot = (r() - .5) * (s.kind === 'bar' ? .22 : .5); s.x += (r() - .5) * .08; s.z += (r() - .5) * .08; }
  return { spots, width: Math.max(fw, P * 1.5) };
}
function buildPile(t, drop) {
  const old = W.piles[t];
  if (old) { W.group.remove(old); }
  const g = new THREE.Group(), n = W.armies[t], h = W.owner[t], { spots, width } = pileSpots(n, rng(t * 97 + 5)), [hx, hy] = W.geo.heart[t];
  const shift = -(1.15 + .98) / 2;
  spots.forEach((s, i) => {
    const m = new THREE.Mesh(GEO[s.kind], pieceMat[h]);
    m.castShadow = m.receiveShadow = true;
    m.position.set(s.x + shift, HGT[s.kind] / 2 + s.lvl * HGT.cube, s.z); m.rotation.y = s.rot;
    if (drop && !CALM) m.userData = { y: m.position.y, t0: performance.now() + i * 45 };
    g.add(m);
  });
  const coin = new THREE.Group(), body = new THREE.Mesh(GEO.coin, coinMat), face = new THREE.Mesh(GEO.face, faceMat(n));
  body.position.y = .13; body.castShadow = body.receiveShadow = true; face.rotation.x = -Math.PI / 2; face.position.y = .262;
  coin.add(body, face); coin.position.set(width / 2 + 1.15 + shift, 0, .25);
  g.add(coin);
  g.scale.setScalar(W.scale);
  g.position.set(hx - W.geo.SW / 2, SHEET_Y, hy - W.geo.SH / 2 - .35);
  W.group.add(g); W.piles[t] = g;
}

function buildBoard(geo, art, st) {
  if (W) { scene.remove(W.group); W.tex.dispose(); W.group.traverse((o) => { if (o.isMesh && !Object.values(GEO).includes(o.geometry)) o.geometry.dispose(); }); }
  const { SW, SH } = geo, group = new THREE.Group();
  const tex = new THREE.CanvasTexture(art.out);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const sheet = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshLambertMaterial({ map: tex, alphaTest: .5 }));
  sheet.rotation.x = -Math.PI / 2; sheet.position.y = SHEET_Y; sheet.receiveShadow = true;
  group.add(sheet);
  { const c = mk(256, 256), x = c.getContext('2d'); x.filter = 'blur(9px)'; x.fillStyle = 'rgba(0,0,0,.8)'; x.fillRect(20, 20, 216, 216);
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(SW * 1.085, SH * 1.085 * (SW / SH > 1 ? 1.04 : 1)), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2; sh.position.set(.8, .015, 1); group.add(sh); }
  // The rods it hangs from, lying with it on the table.
  const rodMat = new THREE.MeshStandardMaterial({ color: '#4a2c17', map: pieceTex, roughness: .5 }), brass = new THREE.MeshStandardMaterial({ color: '#c79a3c', roughness: .32, metalness: .35 });
  for (const z of [-SH / 2 + .5, SH / 2 - .5]) {
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, SW + 7, 24), rodMat); rod.rotation.z = Math.PI / 2; rod.position.set(0, 1, z); rod.castShadow = rod.receiveShadow = true; group.add(rod);
    for (const x of [-SW / 2 - 3.5, SW / 2 + 3.5]) { const f = new THREE.Mesh(new THREE.SphereGeometry(1.35, 20, 14), brass); f.position.set(x, 1, z); f.castShadow = true; group.add(f); }
  }
  scene.add(group);
  const R = Math.max(SW, SH) / 2 + 8;
  sun.position.set(-R * .55, R * 1.35, -R * .5); sun.target.position.set(0, 0, 0);
  Object.assign(sun.shadow.camera, { left: -R * 1.1, right: R * 1.1, top: R * 1.1, bottom: -R * 1.1, near: 1, far: R * 5 }); sun.shadow.camera.updateProjectionMatrix();
  table.scale.set(R * 14, R * 14, 1); tableTex.repeat.set((R * 14) / 90, (R * 14) / 90);
  scene.fog = new THREE.Fog('#050302', R * 3.2, R * 7);
  W = { geo, art, owner: st.owner, armies: st.armies, group, tex, piles: [], hover: null, hoverT: -1, shapes: [], scale: PIECE };
  for (let t = 0; t < geo.nt; t++) buildPile(t, false);
}

function shot(v) {
  const { SW, SH } = W.geo, f = Math.tan((camera.fov * Math.PI) / 360), tilt = v === 'over' ? .001 : .68, padX = 9, padY = 7;
  const d = Math.max(((SH / 2) * Math.cos(tilt) + padY) / f, (SW / 2 + padX) / (f * camera.aspect)) * (v === 'over' ? 1.02 : 1.1);
  const target = new THREE.Vector3(0, 0, v === 'over' ? 0 : SH * .02);
  return { target, pos: new THREE.Vector3(0, d * Math.cos(tilt), target.z + d * Math.sin(tilt)), d };
}
function frame(v, glide) {
  view = v;
  for (const b of document.querySelectorAll('#views button')) b.setAttribute('aria-pressed', String(b.dataset.view === v));
  const to = shot(v);
  controls.minDistance = 22; controls.maxDistance = to.d * 1.5;
  if (!glide || CALM) { camera.position.copy(to.pos); controls.target.copy(to.target); controls.update(); flight = null; return; }
  flight = { t0: performance.now(), p0: camera.position.clone(), q0: controls.target.clone(), ...to };
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); if (W) frame(view, false); });

const bounce = (x) => { const n = 7.5625, d = 2.75; return x < 1 / d ? n * x * x : x < 2 / d ? n * (x -= 1.5 / d) * x + .75 : x < 2.5 / d ? n * (x -= 2.25 / d) * x + .9375 : n * (x -= 2.625 / d) * x + .984375; };
function tick(now) {
  requestAnimationFrame(tick);
  if (!W) return;
  if (flight) {
    const k = clamp((now - flight.t0) / 800, 0, 1), e = k * k * (3 - 2 * k);
    camera.position.lerpVectors(flight.p0, flight.pos, e); controls.target.lerpVectors(flight.q0, flight.target, e);
    if (k === 1) flight = null;
  }
  const { SW, SH } = W.geo;
  controls.target.x = clamp(controls.target.x, -SW / 2, SW / 2); controls.target.z = clamp(controls.target.z, -SH / 2, SH / 2); controls.target.y = 0;
  controls.update();
  // From across the room the pieces are drawn larger, so a count can still be read off the whole board.
  const far = PIECE * clamp(camera.position.distanceTo(controls.target) / 125, 1, 1.8);
  if (Math.abs(far - W.scale) > .005) { W.scale = far; for (const g of W.piles) g.scale.setScalar(far); }
  for (const g of W.piles) for (const m of g.children) if (m.userData.t0) { const k = clamp((now - m.userData.t0) / 420, 0, 1); m.position.y = m.userData.y + (1 - bounce(k)) * 4; m.visible = now >= m.userData.t0; if (k === 1) m.userData = {}; }
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- pointing at the map
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), -SHEET_Y), at = new THREE.Vector3();
const tip = document.getElementById('tip');
function territoryAt(ev) {
  ndc.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(ground, at)) return -1;
  return inLand(W.geo, at.x + W.geo.SW / 2, at.z + W.geo.SH / 2);
}
function hover(t, ev) {
  if (t !== W.hoverT) {
    if (W.hover) { W.group.remove(W.hover); W.hover = null; }
    W.hoverT = t;
    canvas.classList.toggle('over', t >= 0);
    if (t >= 0) {
      let g = W.shapes[t];
      if (!g) { const sh = new THREE.Shape(W.geo.rings[t][0].filter((_, i) => i % 2 === 0).map(([x, y]) => new THREE.Vector2(x - W.geo.SW / 2, -(y - W.geo.SH / 2)))); g = W.shapes[t] = new THREE.ShapeGeometry(sh); }
      W.hover = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: '#fff3c8', transparent: true, opacity: .3, depthWrite: false }));
      W.hover.rotation.x = -Math.PI / 2; W.hover.position.y = SHEET_Y + .02;
      W.group.add(W.hover);
    }
  }
  if (t < 0) { tip.hidden = true; return; }
  const reg = W.geo.regions[W.geo.region[t]], h = HOUSES[W.owner[t]], n = W.armies[t];
  tip.innerHTML = `<b>${W.geo.names[t]}</b><span>${reg.name}, worth ${reg.bonus} when held whole</span><span><i style="background:${h.color}"></i>House ${h.name}, ${n} ${n === 1 ? 'army' : 'armies'}</span>`;
  tip.hidden = false;
  tip.style.left = Math.min(ev.clientX, innerWidth - 290) + 'px'; tip.style.top = Math.min(ev.clientY, innerHeight - 110) + 'px';
}
let down = null;
canvas.addEventListener('pointerdown', (ev) => { down = [ev.clientX, ev.clientY]; });
canvas.addEventListener('pointermove', (ev) => { if (W && ev.pointerType !== 'touch') hover(ev.buttons ? -1 : territoryAt(ev), ev); });
canvas.addEventListener('pointerleave', () => W && hover(-1));
canvas.addEventListener('contextmenu', (ev) => ev.preventDefault());
canvas.addEventListener('pointerup', (ev) => {
  if (!W || !down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 5) return;
  const t = territoryAt(ev);
  if (t < 0) return;
  if (ev.button === 2) { if (W.armies[t] > 1) { W.armies[t]--; buildPile(t, false); } }
  else if (W.owner[t] === picked) { W.armies[t]++; buildPile(t, true); }
  else { W.owner[t] = picked; W.armies[t] = 3; compose(W.art, W.geo, W.owner); W.tex.needsUpdate = true; buildPile(t, true); }
  tally(); hover(t, ev);
});

// ---------------------------------------------------------------- the chrome
const housesEl = document.getElementById('houses');
function tally() {
  housesEl.innerHTML = HOUSES.map((h, i) => {
    const lands = W.owner.filter((o) => o === i).length, men = W.armies.reduce((s, n, t) => s + (W.owner[t] === i ? n : 0), 0);
    return `<button class="house" data-h="${i}" aria-pressed="${i === picked}"><span class="sig" style="background:${h.color}">${h.sigil}</span><b>${h.name}</b><span class="n">${lands} lands, ${men} armies</span></button>`;
  }).join('');
}
housesEl.addEventListener('click', (ev) => { const b = ev.target.closest('.house'); if (b) { picked = +b.dataset.h; tally(); } });
document.getElementById('views').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b && W) frame(b.dataset.view, true); });
const mapsEl = document.getElementById('maps'), boot = document.getElementById('boot');
mapsEl.innerHTML = MAPS.map((m) => `<button data-map="${m.id}">${m.name}</button>`).join('');
mapsEl.addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) { location.hash = b.dataset.map; } });

const cache = new Map();
async function show(id) {
  const mi = Math.max(0, MAPS.findIndex((m) => m.id === id)), def = MAPS[mi];
  for (const b of mapsEl.children) b.setAttribute('aria-pressed', String(b.dataset.map === def.id));
  document.getElementById('bootmsg').textContent = `Drawing ${def.name}`;
  boot.hidden = false; tip.hidden = true;
  await new Promise((r) => setTimeout(r, 40));
  let geo = cache.get(def.id);
  if (!geo) { geo = buildGeo(def, mi); layoutLabels(geo); geo.start = deal(geo, 11 + mi * 5); cache.set(def.id, geo); }
  const art = paintStatic(geo), st = { owner: [...geo.start.owner], armies: [...geo.start.armies] };
  compose(art, geo, st.owner);
  buildBoard(geo, art, st);
  tally(); frame(view, false);
  boot.hidden = true;
  window.__sk = { W, camera, controls, frame, show, look(x, z, d, tilt = .68) { flight = null; controls.target.set(x, 0, z); camera.position.set(x, d * Math.cos(tilt), z + d * Math.sin(tilt)); controls.update(); } };
}
addEventListener('hashchange', () => show(location.hash.slice(1)));

resize();
await Promise.race([Promise.all(['900 40px Cinzel', '700 40px Cinzel', 'italic 400 40px "Crimson Pro"'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]);
requestAnimationFrame(tick);
show(location.hash.slice(1) || 'earth');
</script>
